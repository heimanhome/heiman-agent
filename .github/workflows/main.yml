name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BACKEND_DIR: "backend/heiman"
  CLI_DIR: "cli"
  WEB_DIR: "web"

jobs:
  lint-python:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [ "backend/heiman", "cli" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e . flake8 mypy

      - name: Run flake8
        working-directory: ${{ matrix.directory }}
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run mypy
        working-directory: ${{ matrix.directory }}
        run: mypy src/

  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [ "backend/heiman", "cli" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: ${{ matrix.directory }}
        run: pytest tests/ -v --tb=short

  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install

      - name: Run ESLint
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm lint

      - name: Run TypeScript check
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm check

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install

      - name: Run Vitest
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm test

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [ lint-frontend, test-frontend ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install

      - name: Build frontend
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.WEB_DIR }}/dist/
          retention-days: 7

  build-python:
    name: Python Package Build
    runs-on: ubuntu-latest
    needs: [ lint-python, test-python ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Build backend package
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m build

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: ${{ env.BACKEND_DIR }}/dist/
          retention-days: 7

  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-python ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.WEB_DIR }}/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/heiman-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/heiman-agent:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_VERSION=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ build-docker ]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          echo "This is a placeholder for actual deployment steps."
          echo "Possible deployment methods:"
          echo "- SSH deployment"
          echo "- Kubernetes deployment"
          echo "- Docker Compose deployment"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ deploy-staging ]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production environment
        run: |
          echo "Deploying to production environment..."
          echo "This is a placeholder for actual deployment steps."
          echo "Remember to add proper deployment credentials and steps."

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ build-python, build-frontend ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Summary
        run: |
          echo "## Pipeline Summary"
          echo ""
          echo "### Build Status"
          echo "- Python Lint: ${{ needs.lint-python.result }}"
          echo "- Python Tests: ${{ needs.test-python.result }}"
          echo "- Frontend Lint: ${{ needs.lint-frontend.result }}"
          echo "- Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "- Python Build: ${{ needs.build-python.result }}"
          echo "- Frontend Build: ${{ needs.build-frontend.result }}"
          echo "- Docker Build: ${{ needs.build-docker.result }}"
          echo "- Staging Deploy: ${{ needs.deploy-staging.result }}"
          echo "- Production Deploy: ${{ needs.deploy-production.result }}"
